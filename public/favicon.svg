<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Indigo to Deep Slate -->
    <linearGradient id="cgBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="cgShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Emerald Beacon Glow -->
    <radialGradient id="cgBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="cgGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#818cf8" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cgBgGradient)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Tech Matrix Overlay -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#cgGrid)" />

  <!-- Centered Shield & Checkmark -->
  <g transform="translate(14, 13) scale(1.5)" fill="none" stroke="url(#cgShieldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield Outer Contour -->
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    <!-- Checkmark -->
    <path d="m9 12 2 2 4-4" stroke="#ffffff" stroke-width="2.4" />
  </g>

  <!-- Live Security Telemetry Beacon (Top Right) -->
  <!-- Outer Glow Wave -->
  <circle cx="51" cy="13" r="6" fill="#34d399" fill-opacity="0.35" />
  <!-- Core Emerald Beacon -->
  <circle cx="51" cy="13" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />
</svg>
